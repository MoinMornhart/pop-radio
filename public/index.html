<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Radio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="hero">
      <h1><span class="logo">📻</span> Pop Radio</h1>
      <p>Such deinen Sender auf <a href="https://www.radio.de" target="_blank" rel="noopener">radio.de</a> und kopier die Adresse hierher. Im Popup siehst du dann, welcher Song gerade läuft, und die neuesten News.</p>
      <form id="add-form" class="add-form" autocomplete="off">
        <input id="url-input" type="text" placeholder="radio.de-Link einfügen, z. B. https://www.radio.de/s/1live" aria-label="radio.de-Adresse des Senders">
        <button type="submit" id="add-btn">Hinzufügen</button>
      </form>
      <p class="hint" id="status"></p>
      <div class="examples">
        Beispiele:
        <button type="button" data-example="https://www.radio.de/s/1live">1LIVE</button>
        <button type="button" data-example="https://www.radio.de/s/antennebayern">ANTENNE BAYERN</button>
        <button type="button" data-example="https://www.radio.de/s/bigfm">bigFM</button>
        <button type="button" data-example="https://www.radio.de/s/fm4">FM4</button>
      </div>
    </header>

    <section>
      <h2 class="section-title">Deine Sender</h2>
      <div id="stations" class="stations"></div>
      <p id="empty" class="empty">Noch keine Sender hinzugefügt.</p>
    </section>
  </main>

  <div id="popups"></div>

  <script src="app.js"></script>
</body>
</html>
